<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooling System</title>
    <!--
      CoolPit pit-wall pop-up: single template built from HTML schemas/popup_ui*.html
      (popup_ui.html = CRITICAL_HEAT, popup_ui_cool.html = GREEN_ZONE, popup_ui_cold.html = COLD_SNAP).

      Fill it with the "ui" object returned by decide_vest():
          CoolPitPopup.render(ui, {lap: 45, totalLaps: 57, driver: "VER"})
          CoolPitPopup.showLoading("Analysing lap 45…")
          CoolPitPopup.onAccept / onReject / onContinue = (ui) => { ... }

      Live mode: run  python demo/demo_server.py  and open http://localhost:5000
      Accepted changes first play the 3D cooling vest cinematic (teammate's page at /vest3d), then the lap simulation.
      Preview without a server: open this file and add ?state=critical | green | cold | keep | loading | sim
      (?state=3d needs the server: http://localhost:5000/?state=3d)
      (the sim preview shows the track map only when opened through the server: http://localhost:5000/?state=sim)
    -->
    <style>
        /* Zone themes: colours taken from the three mockups */
        .card[data-zone="CRITICAL_HEAT"] {
            --head-a: #ef4444; --head-b: #dc2626;
            --led: #ef4444; --led-glow: rgba(239, 68, 68, 0.9);
            --status-bg: #fef2f2; --status-line: #ef4444; --status-text: #991b1b;
            --rec: #ef4444; --risk-line: #fecaca;
            --btn: #ef4444; --btn-hover: #dc2626; --btn-active: #b91c1c;
        }
        .card[data-zone="GREEN_ZONE"] {
            --head-a: #06b6d4; --head-b: #0891b2;
            --led: #22c55e; --led-glow: rgba(6, 182, 212, 0.9);
            --status-bg: #ecfeff; --status-line: #06b6d4; --status-text: #164e63;
            --rec: #06b6d4; --risk-line: #a5f3fc;
            --btn: #22c55e; --btn-hover: #0891b2; --btn-active: #0e7490;
        }
        .card[data-zone="COLD_SNAP"] {
            --head-a: #3b82f6; --head-b: #1d4ed8;
            --led: #3b82f6; --led-glow: rgba(59, 130, 246, 0.9);
            --status-bg: #eff6ff; --status-line: #3b82f6; --status-text: #1e40af;
            --rec: #3b82f6; --risk-line: #bfdbfe;
            --btn: #3b82f6; --btn-hover: #1d4ed8; --btn-active: #1e40af;
        }
        .card[data-zone="LOADING"] {
            --head-a: #4b5563; --head-b: #374151;
            --led: #9ca3af; --led-glow: rgba(156, 163, 175, 0.9);
            --status-bg: #f3f4f6; --status-line: #9ca3af; --status-text: #374151;
            --rec: #9ca3af; --risk-line: #e5e7eb;
            --btn: #9ca3af; --btn-hover: #9ca3af; --btn-active: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 850px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--head-a) 0%, var(--head-b) 100%);
            padding: 28px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            transition: background 0.4s;
        }

        .header-left {
            flex: 1;
        }

        .header-right {
            flex-shrink: 0;
            width: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dashboard {
            width: 210px;
            padding: 12px 14px 10px 14px;
            background: linear-gradient(180deg, #1a1a24 0%, #0a0a12 100%);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            position: relative;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding: 0 4px;
        }

        .dashboard-label {
            font-family: 'Courier New', monospace;
            font-size: 9px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1.5px;
        }

        .status-led {
            width: 6px;
            height: 6px;
            background: var(--led);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--led-glow);
            animation: ledPulse 1s ease-in-out infinite;
        }

        .gauge-svg {
            display: block;
            margin: 0 auto;
            width: 100%;
            height: 90px;
        }

        .needle {
            transform-box: view-box;
            transform-origin: 100px 110px;
            transform: rotate(-90deg);
            transition: transform 2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .dashboard-readout {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 4px 0 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: 4px;
        }

        .temp-display {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: 800;
            color: #fbbf24;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.5);
        }

        .temp-unit-label {
            font-family: 'Courier New', monospace;
            font-size: 9px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }

        @keyframes ledPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .title {
            font-size: 28px;
            font-weight: 900;
            color: white;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .subtitle {
            margin-top: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 1.5px;
        }

        .body {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 32px;
            padding: 36px 32px;
        }

        /* Column styling */
        .column {
            display: flex;
            flex-direction: column;
        }

        .conditions {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cond-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .cond-label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cond-value {
            font-size: 26px;
            font-weight: 700;
            color: #1f2937;
            font-variant-numeric: tabular-nums;
        }

        .status {
            margin-top: 16px;
            padding: 12px 14px;
            background: var(--status-bg);
            border-left: 3px solid var(--status-line);
            font-size: 13px;
            color: var(--status-text);
            font-weight: 500;
        }

        /* Recommendation */
        .recommendation {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 14px;
        }

        .rec-label {
            font-size: 11px;
            font-weight: 700;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .rec-value {
            font-size: 42px;
            font-weight: 800;
            color: var(--rec);
            letter-spacing: -0.5px;
        }

        .rec-current {
            font-size: 15px;
            color: #1f2937;
            margin-bottom: 8px;
            font-weight: 600;
            background: #f3f4f6;
            padding: 8px 16px;
            border-radius: 6px;
        }

        .rec-reason {
            font-size: 13px;
            color: #4b5563;
            line-height: 1.5;
            max-width: 200px;
        }

        /* Risks */
        .risks {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
        }

        .risks-title {
            font-size: 11px;
            font-weight: 700;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 2px;
        }

        .risk-item {
            display: flex;
            gap: 10px;
            font-size: 13px;
            color: #374151;
            line-height: 1.4;
            padding: 8px 10px;
            background: #f9fafb;
            border-radius: 6px;
            border-left: 2px solid var(--risk-line);
        }

        .risk-icon {
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 20px 32px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            min-height: 78px;
        }

        .footer-note {
            font-size: 13px;
            font-weight: 600;
            color: #4b5563;
        }

        .btn {
            padding: 11px 32px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:focus-visible {
            outline: 3px solid #111827;
            outline-offset: 2px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-accept {
            background: var(--btn);
            color: white;
        }

        .btn-accept:hover:not(:disabled) {
            background: var(--btn-hover);
        }

        .btn-accept:active:not(:disabled) {
            background: var(--btn-active);
        }

        .btn-reject {
            background: white;
            color: #6b7280;
            border: 1px solid #d1d5db;
        }

        .btn-reject:hover:not(:disabled) {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-reject:active:not(:disabled) {
            background: #e5e7eb;
        }

        /* Loading: dim the content and show a spinner in the recommendation column */
        .card.is-loading .body > :not(.recommendation) {
            opacity: 0.45;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #e5e7eb;
            border-top-color: #6b7280;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        [hidden] { display: none !important; }

        /* ---------- Race view (after Accept / Reject / Continue): every car on the Lusail circuit ---------- */
        .race {
            --race-muted: #7d8898;
            --race-panel: rgba(10, 13, 18, 0.76);
            --race-line: rgba(255, 255, 255, 0.09);
            --vest: #22d3ee;
            position: fixed;
            inset: 0;
            z-index: 40;
            overflow: hidden;
            color: #e8edf3;
            background: radial-gradient(120% 95% at 45% 45%, #172030 0%, #0b0f15 62%, #07090d 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .race canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .race-top {
            position: absolute;
            top: 24px;
            left: 28px;
            display: grid;
            gap: 4px;
        }

        .race-event,
        .hud-label,
        .tower-head {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--race-muted);
        }

        .race-lap {
            display: flex;
            align-items: baseline;
            gap: 10px;
            font-weight: 900;
        }

        .race-lap span {
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--race-muted);
        }

        .race-lap b {
            font-size: 60px;
            line-height: 1;
            letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
        }

        .race-lap i {
            font-style: normal;
            font-size: 22px;
            color: var(--race-muted);
        }

        .tower {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 176px;
            margin: 0;
            padding: 10px 0;
            list-style: none;
            background: var(--race-panel);
            border: 1px solid var(--race-line);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .tower-head {
            padding: 0 14px 8px;
        }

        .tower li {
            display: grid;
            grid-template-columns: 20px 4px 1fr;
            align-items: center;
            gap: 9px;
            padding: 3px 14px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .tower .pos { color: var(--race-muted); text-align: right; }
        .tower .bar { width: 4px; height: 14px; border-radius: 2px; }
        .tower li.ours { background: rgba(34, 211, 238, 0.13); }
        .tower li.ours .code { color: #67e8f9; }

        .race-banner {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 999px;
            background: var(--race-panel);
            border: 1px solid rgba(103, 232, 249, 0.38);
            color: #67e8f9;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            white-space: nowrap;
            transition: opacity 0.6s;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .race-banner.rejected { border-color: rgba(251, 191, 36, 0.45); color: #fbbf24; }
        .race-banner.fade { opacity: 0; }

        .race-flag {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 18px;
            border-radius: 6px;
            background: #fbbf24;
            color: #111827;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .hud {
            position: absolute;
            left: 50%;
            bottom: 26px;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 22px;
            max-width: calc(100% - 32px);
            padding: 14px 24px;
            background: var(--race-panel);
            border: 1px solid var(--race-line);
            border-radius: 14px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .hud-block { display: grid; gap: 6px; }
        .hud-sep { width: 1px; align-self: stretch; background: var(--race-line); }

        .hud-value {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .pips { display: flex; gap: 4px; }

        .pip {
            width: 26px;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            transition: background 0.5s, box-shadow 0.5s;
        }

        .pip.on { background: var(--vest); box-shadow: 0 0 10px var(--vest); }

        .hud-cap {
            width: 140px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .hud-cap div {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #0ea5e9, #67e8f9);
            transition: width 0.6s ease;
        }

        .race-skip {
            position: absolute;
            right: 24px;
            bottom: 30px;
        }

        .btn-ghost {
            background: rgba(10, 13, 18, 0.6);
            color: #e8edf3;
            border: 1px solid rgba(255, 255, 255, 0.16);
        }

        .btn-ghost:hover { background: rgba(255, 255, 255, 0.08); }

        @media (max-width: 900px) {
            .tower { display: none; }
            .race-lap b { font-size: 42px; }
            .race-skip { bottom: auto; top: 24px; }
            .race-banner { top: 118px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .status-led, .spinner { animation: none; }
            .needle { transition: none; }
            .pip, .hud-cap div, .race-banner { transition: none; }
        }

        /* ---------- 3D cooling vest (teammate's page in an iframe, loaded in the background) ---------- */
        .stage3d {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0;
            pointer-events: none;
            background: #0c1116;
            transition: opacity 0.5s;
        }

        .stage3d.show {
            z-index: 50;
            opacity: 1;
            pointer-events: auto;
        }

        .stage3d iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .stage3d-bar {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 8px 8px 16px;
            max-width: calc(100% - 32px);
            background: rgba(15, 20, 27, 0.88);
            border: 1px solid #273142;
            border-radius: 10px;
            color: #e5e9f0;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .stage3d-bar .btn { padding: 8px 16px; font-size: 12px; }


        @media (prefers-reduced-motion: reduce) {
            .status-led, .spinner { animation: none; }
            .needle { transition: none; }
            .level, .capacity-fill { transition: none; }
        }

        @media (max-width: 768px) {
            .header {
                flex-wrap: wrap;
            }

            .body {
                grid-template-columns: 1fr;
                gap: 28px;
                padding: 28px 24px;
            }

            .title {
                font-size: 20px;
            }

            .rec-value {
                font-size: 36px;
            }

            .cond-value {
                font-size: 22px;
            }

            .footer {
                padding: 16px 24px;
                gap: 10px;
                flex-wrap: wrap;
            }

            .btn {
                padding: 10px 28px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="card" id="card" data-zone="LOADING">
        <div class="header">
            <div class="header-left">
                <h1 class="title" id="title">Waiting for data</h1>
                <p class="subtitle" id="subtitle"></p>
            </div>
            <div class="header-right">
                <div class="dashboard">
                    <div class="dashboard-header">
                        <span class="dashboard-label">TEMP MONITOR</span>
                        <div class="status-led"></div>
                    </div>
                    <svg class="gauge-svg" viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <defs>
                            <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#0369a1"/>
                                <stop offset="20%" style="stop-color:#06b6d4"/>
                                <stop offset="45%" style="stop-color:#84cc16"/>
                                <stop offset="65%" style="stop-color:#fbbf24"/>
                                <stop offset="85%" style="stop-color:#f97316"/>
                                <stop offset="100%" style="stop-color:#dc2626"/>
                            </linearGradient>
                        </defs>

                        <path d="M 20 110 A 80 80 0 0 1 180 110" fill="none" stroke="#1a1a24" stroke-width="18"/>
                        <path d="M 20 110 A 80 80 0 0 1 180 110" fill="none" stroke="url(#gaugeGrad)" stroke-width="12" stroke-linecap="round"/>

                        <g stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round">
                            <line x1="25" y1="105" x2="32" y2="98"/>
                            <line x1="50" y1="65" x2="56" y2="61"/>
                            <line x1="100" y1="30" x2="100" y2="38"/>
                            <line x1="150" y1="65" x2="144" y2="61"/>
                            <line x1="175" y1="105" x2="168" y2="98"/>
                        </g>

                        <g fill="rgba(255,255,255,0.7)" font-family="Courier New, monospace" font-size="10" font-weight="700">
                            <text x="20" y="125" text-anchor="middle">C</text>
                            <text x="180" y="125" text-anchor="middle">H</text>
                        </g>

                        <g class="needle" id="needle">
                            <line x1="100" y1="110" x2="100" y2="35" stroke="#ffff00" stroke-width="4" stroke-linecap="round"/>
                        </g>

                        <circle cx="100" cy="110" r="10" fill="#1a1a24" stroke="#ffd700" stroke-width="2"/>
                        <circle cx="100" cy="110" r="5" fill="#ffd700"/>
                    </svg>
                    <div class="dashboard-readout">
                        <span class="temp-unit-label">TRACK</span>
                        <span class="temp-display" id="gauge-temp">--°C</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="body">
            <div class="column">
                <div class="conditions">
                    <div class="cond-item">
                        <span class="cond-label">Air</span>
                        <span class="cond-value" id="air">--</span>
                    </div>
                    <div class="cond-item">
                        <span class="cond-label">Track</span>
                        <span class="cond-value" id="track">--</span>
                    </div>
                    <div class="cond-item">
                        <span class="cond-label">Humidity</span>
                        <span class="cond-value" id="humidity">--</span>
                    </div>
                </div>
                <div class="status" id="status">Waiting for race data</div>
            </div>

            <div class="recommendation" id="recommendation" aria-live="polite">
                <div class="rec-label" id="rec-label">Switch to</div>
                <div class="rec-value" id="rec-value">--</div>
                <div class="rec-current" id="rec-current">From: --</div>
                <div class="rec-reason" id="rec-reason"></div>
            </div>

            <div class="risks">
                <div class="risks-title">Monitor</div>
                <div id="monitor"></div>
            </div>
        </div>

        <div class="footer" id="footer">

    <script>
    (function () {
        // Gauge: track temperature mapped linearly onto the dial (placeholder range)
        var GAUGE_MIN_C = 20, GAUGE_MAX_C = 45;
        var STATUS_ICON = { CRITICAL_HEAT: "⚠️", GREEN_ZONE: "✓", COLD_SNAP: "✓" };

        var $ = function (id) { return document.getElementById(id); };

        function needleAngle(tempC) {
            var t = Math.max(GAUGE_MIN_C, Math.min(GAUGE_MAX_C, tempC));
            return -90 + (t - GAUGE_MIN_C) / (GAUGE_MAX_C - GAUGE_MIN_C) * 180;
        }

        function setNeedle(tempC) {
            var needle = $("needle");
            needle.style.transform = "rotate(-90deg)";
            // restart the sweep from the left, like the original mockups
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    needle.style.transform = "rotate(" + needleAngle(tempC) + "deg)";
                });
            });
        }

        function round(v) { return Math.round(Number(v)); }

        function button(label, cls, handler) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "btn " + cls;
            b.textContent = label;
            b.addEventListener("click", handler);
            return b;
        }

        function renderMonitor(items) {
            var box = $("monitor");
            box.innerHTML = "";
            box.style.display = "flex";
            box.style.flexDirection = "column";
            box.style.gap = "12px";
            (items || []).forEach(function (text) {
                var row = document.createElement("div");
                row.className = "risk-item";
                var icon = document.createElement("span");
                icon.className = "risk-icon";
                icon.textContent = "•";
                var label = document.createElement("span");
                label.textContent = text;
                row.appendChild(icon);
                row.appendChild(label);
                box.appendChild(row);
            });
        }

        function renderFooter(ui) {
            var footer = $("footer");
            footer.innerHTML = "";
            if (ui.change_required) {
                footer.appendChild(button(ui.accept_label, "btn-accept", function () { respond(true, ui); }));
                footer.appendChild(button(ui.reject_label, "btn-reject", function () { respond(false, ui); }));
            } else {
                var note = document.createElement("span");
                note.className = "footer-note";
                note.textContent = "No action needed: keeping " + ui.switch_to;
                footer.appendChild(note);
                footer.appendChild(button("Continue", "btn-reject", function () {
                    this.disabled = true;
                    CoolPitPopup.onContinue(ui);
                }));
            }
        }

        function respond(accepted, ui) {
            document.querySelectorAll("#footer .btn").forEach(function (b) { b.disabled = true; });
            var handler = accepted ? CoolPitPopup.onAccept : CoolPitPopup.onReject;
            handler(ui);
        }

        var CoolPitPopup = {
            /** Fill the pop-up with the "ui" object from decide_vest(). meta = {lap, totalLaps, driver} (optional). */
            render: function (ui, meta) {
                meta = meta || {};
                var card = $("card");
                card.classList.remove("is-loading");
                card.dataset.zone = ui.zone;

                $("title").textContent = ui.title;
                var sub = [];
                if (meta.lap) sub.push("LAP " + meta.lap + (meta.totalLaps ? " / " + meta.totalLaps : ""));
                if (meta.driver) sub.push(meta.driver);
                if (meta.vest) sub.push("VEST " + meta.vest.setting + " · " + meta.vest.capacity_remaining_pct + "% LEFT");
                if (meta.source === "fallback") sub.push("RULE-BASED");
                $("subtitle").textContent = sub.join(" · ");

                $("gauge-temp").textContent = round(ui.track_temp_c) + "°C";
                setNeedle(ui.track_temp_c);
                $("air").textContent = round(ui.air_temp_c) + "°";
                $("track").textContent = round(ui.track_temp_c) + "°";
                $("humidity").textContent = round(ui.humidity_pct) + "%";
                $("status").textContent = (STATUS_ICON[ui.zone] || "") + " " + ui.status_text;

                var recommendation = $("recommendation");
                recommendation.innerHTML = "";
                var label = document.createElement("div");
                label.className = "rec-label";
                label.textContent = ui.change_required ? "Switch to" : "Keep";
                var value = document.createElement("div");
                value.className = "rec-value";
                value.textContent = ui.switch_to;
                var current = document.createElement("div");
                current.className = "rec-current";
                current.textContent = ui.change_required ? "From: " + ui.from : "No change needed";
                var reason = document.createElement("div");
                reason.className = "rec-reason";
                reason.textContent = ui.reason;
                [label, value, current, reason].forEach(function (el) { recommendation.appendChild(el); });

                renderMonitor(ui.monitor);
                renderFooter(ui);
            },

            /** Show the waiting state while Gemini is thinking (5-15 s). */
            showLoading: function (message) {
                var card = $("card");
                card.classList.add("is-loading");
                card.dataset.zone = "LOADING";
                var recommendation = $("recommendation");
                recommendation.innerHTML = "";
                var spinner = document.createElement("div");
                spinner.className = "spinner";
                var text = document.createElement("div");
                text.className = "rec-label";
                text.textContent = message || "Analysing…";
                recommendation.appendChild(spinner);
                recommendation.appendChild(text);
                document.querySelectorAll("#footer .btn").forEach(function (b) { b.disabled = true; });
            },

            // Replaced by live mode (below) to call the server. Preview mode just shows the choice.
            onAccept: function (ui) { previewNote("Accepted: change to " + ui.switch_to); },
            onReject: function (ui) { previewNote("Rejected: stay with " + ui.from); },
            onContinue: function (ui) { previewNote("Kept " + ui.switch_to); },

            /** Replace the footer with a message and optional buttons [{label, primary, onClick}]. */
            footerMessage: function (text, buttons) {
                var footer = $("footer");
                footer.innerHTML = "";
                var note = document.createElement("span");
                note.className = "footer-note";
                note.textContent = text;
                footer.appendChild(note);
                (buttons || []).forEach(function (b) {
                    footer.appendChild(button(b.label, b.primary ? "btn-accept" : "btn-reject", b.onClick));
                });
            }
        };

        function previewNote(text) {
            var footer = $("footer");
            footer.innerHTML = "";
            var note = document.createElement("span");
            note.className = "footer-note";
            note.textContent = text + " (preview: not sent anywhere)";
            footer.appendChild(note);
        }

        window.CoolPitPopup = CoolPitPopup;

        // ---- Preview mode: ?state=critical | green | cold | keep | loading ----
        // "critical" is the real Gemini output for lap 45 of the 2023 Qatar GP (sample_output.json).
        // The other states use made-up example values to show the layouts.
        var PREVIEW = {
            critical: {
                meta: { lap: 45, totalLaps: 57, driver: "VER" },
                ui: {
                    zone: "CRITICAL_HEAT", title: "CRITICAL HEAT", status_text: "Above threshold",
                    track_temp_c: 35.6, air_temp_c: 31.1, humidity_pct: 76.0, heat_index_c: 39.8,
                    switch_to: "MEDIUM", from: "LOW", change_required: true,
                    reason: "Ample capacity remaining and rising heat index justify stepping up to MEDIUM cooling.",
                    monitor: ["Remaining capacity vs final laps", "Heat index rate of increase", "Pace consistency under green flag"],
                    accept_label: "Change to MEDIUM", reject_label: "Stay with LOW"
                }
            },
            green: {
                meta: { lap: 20, totalLaps: 57, driver: "EXAMPLE" },
                ui: {
                    zone: "GREEN_ZONE", title: "GREEN ZONE", status_text: "Optimal range",
                    track_temp_c: 32, air_temp_c: 24, humidity_pct: 58, heat_index_c: 24.5,
                    switch_to: "LOW", from: "MEDIUM", change_required: true,
                    reason: "Moderate heat and steady trend; step down to save capacity.",
                    monitor: ["Heat index trend", "Remaining vest capacity", "Safety car periods"],
                    accept_label: "Change to LOW", reject_label: "Stay with MEDIUM"
                }
            },
            cold: {
                meta: { lap: 12, totalLaps: 57, driver: "EXAMPLE" },
                ui: {
                    zone: "COLD_SNAP", title: "COLD SNAP", status_text: "Well below threshold",
                    track_temp_c: 28, air_temp_c: 12, humidity_pct: 72, heat_index_c: 11.4,
                    switch_to: "OFF", from: "MEDIUM", change_required: true,
                    reason: "Low heat load; turning cooling off preserves full capacity.",
                    monitor: ["Air temperature changes", "Rain risk", "Remaining vest capacity"],
                    accept_label: "Change to OFF", reject_label: "Stay with MEDIUM"
                }
            },
            keep: {
                meta: { lap: 30, totalLaps: 57, driver: "EXAMPLE" },
                ui: {
                    zone: "CRITICAL_HEAT", title: "CRITICAL HEAT", status_text: "Above threshold",
                    track_temp_c: 36, air_temp_c: 31, humidity_pct: 74, heat_index_c: 39.2,
                    switch_to: "MEDIUM", from: "MEDIUM", change_required: false,
                    reason: "Heat index stable; current MEDIUM setting is sufficient.",
                    monitor: ["Heat index trend", "Remaining vest capacity", "Laps remaining"],
                    accept_label: null, reject_label: null
                }
            }
        };

        // ---- Race view: every car on the circuit for the laps after a decision (real lap timing) ----
        var LAP_SECONDS = 2.6;        // on-screen seconds per lap of our driver
        var END_PAUSE_MS = 1800;      // pause on the final frame before the next decision
        var VEST_COLOR = { OFF: "#9ca3af", LOW: "#67e8f9", MEDIUM: "#22d3ee", HIGH: "#0ea5e9" };
        var VEST_LEVEL = { OFF: 0, LOW: 1, MEDIUM: 2, HIGH: 3 };
        var FLAG_TEXT = { SAFETY_CAR: "SAFETY CAR", VSC: "VIRTUAL SAFETY CAR", VSC_ENDING: "VSC ENDING",
                          YELLOW: "YELLOW FLAG", RED_FLAG: "RED FLAG" };
        var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var track = null, trackReady = null;

        function loadTrack() {
            if (trackReady) return trackReady;
            trackReady = fetch("/api/track").then(function (r) {
                if (!r.ok) throw new Error("no track");
                return r.json();
            }).then(function (t) {
                var pts = t.points, cum = [0];
                for (var i = 1; i <= pts.length; i++) {
                    var a = pts[i - 1], b = pts[i % pts.length];
                    cum.push(cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1]));
                }
                var xs = pts.map(function (p) { return p[0]; }), ys = pts.map(function (p) { return p[1]; });
                track = { pts: pts, cum: cum, total: cum[cum.length - 1],
                          minX: Math.min.apply(null, xs), maxX: Math.max.apply(null, xs),
                          minY: Math.min.apply(null, ys), maxY: Math.max.apply(null, ys) };
                return track;
            }).catch(function () { return null; });
            return trackReady;
        }

        function pointAt(frac) {
            var d = ((frac % 1) + 1) % 1 * track.total, cum = track.cum, lo = 0, hi = cum.length - 1;
            while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (cum[mid] <= d) lo = mid; else hi = mid; }
            var a = track.pts[lo % track.pts.length], b = track.pts[(lo + 1) % track.pts.length];
            var k = (d - cum[lo]) / ((cum[lo + 1] - cum[lo]) || 1);
            return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
        }

        /** Real race progress (laps completed + fraction) of one car at window time t, or null when off track. */
        function carProgress(driver, t) {
            var laps = driver.laps;
            for (var i = 0; i < laps.length; i++) {
                var n = laps[i][0], start = laps[i][1], dur = laps[i][2];
                if (t >= start && t < start + dur) return (n - 1) + (t - start) / dur;
            }
            if (laps.length && t < laps[0][1]) return laps[0][0] - 1;   // just before its first lap in the window
            return null;                                                  // retired or finished
        }

        /** Canvas sizing + a cached image of the circuit, redrawn on resize. */
        function RaceCanvas(canvas) {
            var self = this, ctx = canvas.getContext("2d"), cache = document.createElement("canvas");
            self.ctx = ctx;
            self.resize = function () {
                var dpr = Math.min(window.devicePixelRatio || 1, 2);
                var w = canvas.clientWidth, h = canvas.clientHeight;
                canvas.width = cache.width = Math.round(w * dpr);
                canvas.height = cache.height = Math.round(h * dpr);
                var wide = w > 900;
                var padL = 60, padR = wide ? 240 : 40, padT = wide ? 120 : 170, padB = 130;
                var sw = (w - padL - padR) / (track.maxX - track.minX), sh = (h - padT - padB) / (track.maxY - track.minY);
                var s = Math.max(0.1, Math.min(sw, sh));
                var ox = padL + ((w - padL - padR) - (track.maxX - track.minX) * s) / 2 - track.minX * s;
                var oy = padT + ((h - padT - padB) - (track.maxY - track.minY) * s) / 2 - track.minY * s;
                self.map = function (p) { return [(ox + p[0] * s) * dpr, (oy + p[1] * s) * dpr]; };
                self.dpr = dpr;
                drawTrack(cache.getContext("2d"));
            };
            function drawTrack(c) {
                var d = self.dpr;
                c.clearRect(0, 0, cache.width, cache.height);
                c.lineJoin = "round"; c.lineCap = "round";
                var path = new Path2D();
                track.pts.forEach(function (p, i) { var m = self.map(p); if (i) path.lineTo(m[0], m[1]); else path.moveTo(m[0], m[1]); });
                path.closePath();
                [[46, "rgba(103, 232, 249, 0.035)"], [30, "rgba(255, 255, 255, 0.07)"], [24, "#1a212b"],
                 [2, "rgba(255, 255, 255, 0.06)"]].forEach(function (st) {
                    c.lineWidth = st[0] * d; c.strokeStyle = st[1]; c.stroke(path);
                });
                // start / finish line: a short chequered bar across the track
                var p0 = self.map(pointAt(0)), p1 = self.map(pointAt(0.004));
                var ang = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]) + Math.PI / 2, sq = 3 * d;
                c.save(); c.translate(p0[0], p0[1]); c.rotate(ang);
                for (var i = -4; i < 4; i++) for (var j = 0; j < 2; j++) {
                    c.fillStyle = (i + j) % 2 ? "#e8edf3" : "#111827";
                    c.fillRect(i * sq, (j - 1) * sq, sq, sq);
                }
                c.restore();
            }
            self.draw = function (cars, ours, oursLevel, pulse) {
                var d = self.dpr;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(cache, 0, 0);
                cars.forEach(function (car) {
                    if (car.code === ours) return;
                    drawCar(car, 5.5 * d, null);
                });
                var me = cars.filter(function (c) { return c.code === ours; })[0];
                if (me) drawCar(me, 8 * d, { level: oursLevel, pulse: pulse });
            };
            function drawCar(car, r, halo) {
                var d = self.dpr, pos = self.map(pointAt(car.frac));
                // trail
                for (var k = 1; k <= 7; k++) {
                    var a = self.map(pointAt(car.frac - (k - 1) * 0.0022)), b = self.map(pointAt(car.frac - k * 0.0022));
                    ctx.strokeStyle = car.color; ctx.globalAlpha = 0.42 * (1 - k / 8);
                    ctx.lineWidth = r * 0.9; ctx.lineCap = "round";
                    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
                }
                ctx.globalAlpha = 1;
                if (halo) {
                    var rad = (10 + 9 * halo.level) * d * (1 + 0.12 * halo.pulse);
                    var g = ctx.createRadialGradient(pos[0], pos[1], r, pos[0], pos[1], rad);
                    g.addColorStop(0, halo.level ? "rgba(34, 211, 238, 0.55)" : "rgba(156, 163, 175, 0.35)");
                    g.addColorStop(1, "rgba(34, 211, 238, 0)");
                    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(pos[0], pos[1], rad, 0, Math.PI * 2); ctx.fill();
                }
                ctx.fillStyle = car.color; ctx.strokeStyle = halo ? "#ffffff" : "rgba(0, 0, 0, 0.65)";
                ctx.lineWidth = (halo ? 2.5 : 1.5) * d;
                ctx.beginPath(); ctx.arc(pos[0], pos[1], r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                if (halo) {
                    var label = car.code, fs = 12 * d;
                    ctx.font = "800 " + fs + "px 'Courier New', monospace";
                    var tw = ctx.measureText(label).width, px = pos[0] + 14 * d, py = pos[1] - 24 * d;
                    ctx.fillStyle = "rgba(10, 13, 18, 0.85)";
                    roundRect(ctx, px - 7 * d, py - fs * 0.85, tw + 14 * d, fs * 1.5, 5 * d); ctx.fill();
                    ctx.fillStyle = "#67e8f9"; ctx.fillText(label, px, py + fs * 0.25);
                }
            }
            function roundRect(c, x, y, w, h, r) {
                c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
                c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
            }
        }

        function renderTower(cars, ours) {
            var order = cars.slice().sort(function (a, b) { return b.progress - a.progress; });
            var top = order.slice(0, 10), mine = order.findIndex(function (c) { return c.code === ours; });
            if (mine >= 10) top[9] = order[mine];
            var html = '<li class="tower-head">Running order</li>';
            top.forEach(function (c) {
                var pos = order.indexOf(c) + 1;
                html += '<li class="' + (c.code === ours ? "ours" : "") + '"><span class="pos">' + pos +
                    '</span><span class="bar" style="background:' + c.color + '"></span><span class="code">' + c.code + '</span></li>';
            });
            $("tower").innerHTML = html;
        }

        function setVestHud(setting, capacity) {
            var level = VEST_LEVEL[setting] || 0;
            $("race").style.setProperty("--vest", VEST_COLOR[setting] || "#22d3ee");
            document.querySelectorAll("#pips .pip").forEach(function (p, i) { p.classList.toggle("on", i < level); });
            $("hud-setting").textContent = setting;
            $("hud-cap-val").textContent = capacity + "%";
            $("hud-cap").style.width = Math.max(0, Math.min(100, capacity)) + "%";
        }

        /** Field data for the animation; falls back to our car alone at a steady pace. */
        function fieldFor(sim, meta) {
            if (sim.field && sim.field.drivers && sim.field.drivers.length) return sim.field;
            var laps = sim.laps.map(function (l, i) { return [l.lap, i * 90, 90]; });
            return { duration_s: laps.length * 90, ours: meta.driver,
                     our_lap_starts: laps.map(function (l) { return [l[0], l[1]]; }),
                     drivers: [{ code: meta.driver, color: "#3671C6", laps: laps }] };
        }
        // ---- 3D cooling vest bridge ----
        // Drives the teammate's page (F1 Cooling Vest 3D.html, served at /vest3d) by pressing its own
        // pump / voltage buttons. Any change there starts its ~40 s cinematic; we wait for its progress bar
        // to appear and disappear again. The teammate's file itself is not modified.
        var VEST3D_TIMEOUT_MS = 80000;

        function vest3dDoc() {
            try {
                var doc = $("vest3d").contentDocument;
                return doc && doc.getElementById("coolBtn") && doc.getElementById("progress") ? doc : null;
            } catch (e) { return null; }
        }

        function loadVest3d() {
            var frame = $("vest3d");
            if (!frame.getAttribute("src")) frame.setAttribute("src", "/vest3d");
        }

        /** Show the 3D cinematic for the new setting. Resolves true when it played, false when skipped/unavailable. */
        function play3D(setting, airTempC, lap) {
            return new Promise(function (resolve) {
                var doc = vest3dDoc();
                var progress = doc && doc.getElementById("progress");
                if (!doc || !progress.hidden) return resolve(false);   // not loaded yet, or still busy

                var win = $("vest3d").contentWindow;
                var temp = doc.getElementById("temp");
                temp.value = Math.max(20, Math.min(40, Math.round(airTempC)));
                temp.dispatchEvent(new win.Event("input", { bubbles: true }));

                var coolBtn = doc.getElementById("coolBtn");
                var on = coolBtn.getAttribute("aria-pressed") === "true";
                var volt = function (v) { return doc.querySelector('[data-volt="' + v + '"]'); };
                var current = (doc.querySelector('[data-volt][aria-pressed="true"]') || {}).dataset;
                current = current ? current.volt : "medium";

                // The first click starts the cinematic; any click after that only changes the state it ends in.
                if (setting === "OFF") {
                    if (on) coolBtn.click(); else { coolBtn.click(); coolBtn.click(); }
                } else {
                    var v = setting.toLowerCase();
                    if (!on) { if (current !== v) volt(v).click(); coolBtn.click(); }
                    else if (current !== v) volt(v).click();
                    else { volt(v === "high" ? "medium" : "high").click(); volt(v).click(); }
                }

                var stage = $("stage3d");
                stage.classList.add("show");
                stage.setAttribute("aria-hidden", "false");
                $("stage3d-text").textContent = "Lap " + lap + " · cooling vest set to " + setting +
                    " · air " + Math.round(airTempC) + "°C";

                var started = false, t0 = Date.now(), timer;
                function end(played) {
                    clearInterval(timer);
                    stage.classList.remove("show");
                    stage.setAttribute("aria-hidden", "true");
                    resolve(played);
                }
                $("stage3d-skip").onclick = function () { end(false); };
                timer = setInterval(function () {
                    if (!progress.hidden) started = true;
                    if ((started && progress.hidden) || Date.now() - t0 > VEST3D_TIMEOUT_MS) end(true);
                }, 250);
            });
        }

        CoolPitPopup.play3D = play3D;

        /** Play the laps after a decision, then call done(). meta = state from /api/respond. */
        function playSimulation(sim, meta, done) {
            if (!sim || !sim.laps || !sim.laps.length) return done();
            sim.totalLaps = meta.total_laps;
            $("card").hidden = true;
            // A change the engineer accepted is shown in 3D first, then the lap-by-lap simulation
            if (sim.change_required && sim.accepted && vest3dDoc()) {
                play3D(sim.setting_after, sim.laps[0].air_temp_c, sim.decision_lap).then(function () {
                    playLaps(sim, meta, done);
                });
            } else {
                playLaps(sim, meta, done);
            }
        }

        function playLaps(sim, meta, done) {
            var race = $("race"), field = fieldFor(sim, meta), ours = field.ours;
            var lapByNumber = {};
            sim.laps.forEach(function (l) { lapByNumber[l.lap] = l; });

            $("race-event").textContent = "Lusail · " + (sim.race || meta.race || "");
            $("race-total").textContent = "/ " + meta.total_laps;
            var banner = $("race-banner");
            banner.className = "race-banner";
            banner.textContent = !sim.change_required ? "Vest kept on " + sim.setting_after
                : sim.accepted ? "Vest " + sim.setting_before + " → " + sim.setting_after
                : "Change rejected · vest stays " + sim.setting_after;
            if (sim.change_required && !sim.accepted) banner.classList.add("rejected");
            setVestHud(sim.setting_after, sim.capacity_before);
            race.hidden = false;

            var finished = false, startTime = null, lastTower = 0, endTimer = null, view = null, shownLap = null;
            var speed = field.duration_s / (sim.laps.length * LAP_SECONDS);   // race seconds per screen second
            var bannerTimer = setTimeout(function () { banner.classList.add("fade"); }, 3500);

            function ourLapAt(t) {
                var n = field.our_lap_starts[0][0];
                field.our_lap_starts.forEach(function (s) { if (t >= s[1]) n = s[0]; });
                return n;
            }
            function showLap(n) {
                if (n === shownLap) return;
                shownLap = n;
                var l = lapByNumber[n] || sim.laps[sim.laps.length - 1];
                $("race-lap").textContent = n;
                $("hud-hi").textContent = l.heat_index_c + "°C";
                $("hud-air").textContent = l.air_temp_c + "°C";
                setVestHud(sim.setting_after, l.capacity_pct);
                var flag = $("race-flag");
                flag.hidden = l.track_status === "GREEN";
                flag.textContent = FLAG_TEXT[l.track_status] || l.track_status;
            }
            function carsAt(t) {
                var list = [];
                field.drivers.forEach(function (d) {
                    var p = carProgress(d, t);
                    if (p !== null) list.push({ code: d.code, color: d.color, progress: p, frac: p % 1 });
                });
                return list;
            }
            function render(t, now) {
                var cars = carsAt(t);
                if (view) view.draw(cars, ours, VEST_LEVEL[sim.setting_after] || 0, Math.sin(now / 260));
                if (now - lastTower > 300) { renderTower(cars, ours); lastTower = now; }
                showLap(ourLapAt(t));
            }
            function frame(now) {
                if (finished) return;
                if (startTime === null) startTime = now;
                var t = (now - startTime) / 1000 * speed;
                if (t >= field.duration_s) return finish();
                render(t, now);
                requestAnimationFrame(frame);
            }
            function finish() {
                if (finished) return;
                finished = true;
                render(field.duration_s - 0.01, performance.now());
                showLap(sim.laps[sim.laps.length - 1].lap);
                clearTimeout(bannerTimer);
                banner.className = "race-banner";
                banner.textContent = meta.finished ? "Chequered flag" : "Next decision · lap " + meta.lap;
                $("race-skip").disabled = true;
                endTimer = setTimeout(leave, END_PAUSE_MS);
            }
            function leave() {
                clearTimeout(endTimer);
                window.removeEventListener("resize", onResize);
                race.hidden = true;
                $("card").hidden = false;
                done();
            }
            function onResize() { if (view) view.resize(); }

            var skip = $("race-skip");
            skip.disabled = false;
            skip.onclick = function () { if (finished) leave(); else finish(); };

            loadTrack().then(function (t) {
                if (t) {
                    view = new RaceCanvas($("race-canvas"));
                    view.resize();
                    window.addEventListener("resize", onResize);
                }
                if (reduceMotion) finish(); else requestAnimationFrame(frame);
            });
        }
        CoolPitPopup.playSimulation = playSimulation;

        // ---- Live mode: served by demo/demo_server.py (http://localhost:5000) ----
        function api(method, path, body) {
            return fetch(path, {
                method: method,
                headers: { "Content-Type": "application/json" },
                body: body ? JSON.stringify(body) : undefined
            }).then(function (r) {
                return r.json().then(function (data) {
                    if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
                    return data;
                });
            });
        }

        function renderDecision(d) {
            CoolPitPopup.render(d.ui, {
                lap: d.lap, totalLaps: d.total_laps, driver: d.driver, vest: d.vest_state, source: d.source
            });
        }

        function loadLap(st) {
            if (st.finished) return showFinished(st);
            CoolPitPopup.showLoading("Analysing lap " + st.lap + "…");
            $("subtitle").textContent = "LAP " + st.lap + " / " + st.total_laps + " · " + st.driver +
                " · VEST " + st.vest_state.setting + " · " + st.vest_state.capacity_remaining_pct + "% LEFT";
            api("POST", "/api/decide").then(renderDecision).catch(showError);
        }

        function sendResponse(accepted, message) {
            CoolPitPopup.footerMessage(message);
            api("POST", "/api/respond", { accepted: accepted }).then(function (st) {
                if (!("simulation" in st)) {
                    // server started before the simulation feature was added
                    CoolPitPopup.footerMessage("No simulation data: the demo server is running old code. " +
                        "Stop it (Ctrl+C) and start it again.", [{
                        label: "Continue without simulation", primary: false,
                        onClick: function () { loadLap(st); }
                    }]);
                    return;
                }
                playSimulation(st.simulation, st, function () { loadLap(st); });
            }).catch(showError);
        }

        function showError(err) {
            $("card").classList.remove("is-loading");
            CoolPitPopup.footerMessage("Could not reach the demo server: " + err.message, [{
                label: "Retry", primary: true,
                onClick: function () { api("GET", "/api/state").then(start).catch(showError); }
            }]);
        }

        function showFinished(st) {
            var card = $("card");
            card.classList.remove("is-loading");
            card.dataset.zone = "LOADING";
            $("title").textContent = "Race finished";
            $("subtitle").textContent = st.race + " · " + st.driver + " · VEST " + st.vest_state.setting +
                " · " + st.vest_state.capacity_remaining_pct + "% LEFT";
            $("status").textContent = st.history.length + " decisions made";

            var changes = st.history.filter(function (h) { return h.change_required; });
            var accepted = changes.filter(function (h) { return h.accepted; }).length;
            var recommendation = $("recommendation");
            recommendation.innerHTML = "";
            [["rec-label", "Accepted changes"],
             ["rec-value", accepted + " / " + changes.length],
             ["rec-reason", "Final setting " + st.vest_state.setting + " with " +
                 st.vest_state.capacity_remaining_pct + "% capacity left."]].forEach(function (p) {
                var el = document.createElement("div");
                el.className = p[0];
                el.textContent = p[1];
                recommendation.appendChild(el);
            });

            renderMonitor(st.history.map(function (h) {
                var what = !h.change_required ? "kept " + h.applied_setting
                    : (h.accepted ? "accepted " : "rejected ") + h.previous + " → " + h.recommended;
                return "Lap " + h.lap + ": " + what;
            }));
            CoolPitPopup.footerMessage("Replay finished.", [{
                label: "Restart race", primary: true,
                onClick: function () { this.disabled = true; api("POST", "/api/reset").then(loadLap).catch(showError); }
            }]);
        }

        function start(st) {
            // After a page refresh, reuse the decision already made for this lap (saves Gemini quota)
            if (st.last && st.last.lap === st.lap && !st.finished) return renderDecision(st.last);
            loadLap(st);
        }

        var params = new URLSearchParams(location.search);
        var previewState = params.get("state");
        var LIVE = /^https?:$/.test(location.protocol) && !previewState;

        if (LIVE) {
            CoolPitPopup.onAccept = function (ui) { sendResponse(true, "Changed to " + ui.switch_to + ". Moving to the next lap…"); };
            CoolPitPopup.onReject = function (ui) { sendResponse(false, "Staying with " + ui.from + ". Moving to the next lap…"); };
            CoolPitPopup.onContinue = function (ui) { sendResponse(false, "Keeping " + ui.switch_to + ". Moving to the next lap…"); };
            loadVest3d();   // load the 3D page in the background so it is ready by the first accepted change
            api("GET", "/api/state").then(start).catch(showError);
        } else if (previewState === "3d") {
            // preview of the 3D step through the server (http://localhost:5000/?state=3d)
            loadVest3d();
            $("card").hidden = true;
            var tryPlay = function () {
                if (!vest3dDoc()) return setTimeout(tryPlay, 500);
                CoolPitPopup.play3D("MEDIUM", 31.9, 15).then(function (played) {
                    $("card").hidden = false;
                    CoolPitPopup.render(PREVIEW.critical.ui, PREVIEW.critical.meta);
                    CoolPitPopup.footerMessage("3D preview finished (" + (played ? "played" : "skipped") + ").");
                });
            };
            tryPlay();
        } else if (previewState === "sim") {
            // preview of the race view with real data for the laps after lap 15 (needs the server)
            fetch("/api/preview-sim?lap=15").then(function (r) { return r.json(); }).then(function (exampleSim) {
                var loop = function () {
                    CoolPitPopup.playSimulation(exampleSim, { total_laps: 57, lap: 20, race: exampleSim.race,
                        driver: "VER", finished: false }, function () { setTimeout(loop, 500); });
                };
                loop();
            }).catch(function () {
                CoolPitPopup.footerMessage("The race preview needs the demo server: http://localhost:5000/?state=sim");
            });
        } else if (previewState === "loading") {
            CoolPitPopup.render(PREVIEW.critical.ui, PREVIEW.critical.meta);
            CoolPitPopup.showLoading("Analysing lap 45…");
        } else {
            // opened as a file: preview with example data (default = real lap-45 result)
            var p = PREVIEW[previewState] || PREVIEW.critical;
            CoolPitPopup.render(p.ui, p.meta);
        }
    })();
    </script>
</body>
