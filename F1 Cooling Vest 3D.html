<style>
  :root {
    color-scheme: dark;
    --ground: #10151b;
    --panel: #171e26;
    --panel-2: #1e2731;
    --line: #2c3845;
    --ink: #e7edf2;
    --ink-2: #9fb0bf;
    --ice: #5fd4ff;
    --heat: #ff8a3d;
    --hazard: #ffcc33;
    --amr: #1d6b5c;
    --lime: #c4f000;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  html, body { height: 100%; margin: 0; background: var(--ground); color: var(--ink); overflow: hidden; }
  body { font-family: var(--body); font-size: 15px; line-height: 1.55; }
  .viewport { position: relative; width: 100%; height: 100%; background: radial-gradient(110% 90% at 50% 25%, #223040 0%, #0c1116 72%); overflow: hidden; }
  .viewport canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .viewport canvas:active { cursor: grabbing; }
  [hidden] { display: none !important; }
  .lock { position: absolute; inset: 0; z-index: 5; cursor: default; }
  .fade { position: absolute; inset: 0; z-index: 6; background: #000; opacity: 0; pointer-events: none; transition: opacity .7s ease; }
  .fade.on { opacity: 1; }
  .progress { position: absolute; right: 16px; bottom: 16px; z-index: 7; width: min(280px, calc(100% - 32px)); box-sizing: border-box; padding: 10px 12px 12px;
    background: rgba(23, 30, 38, .82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 8px; }
  .progress-top { display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 7px; }
  .progress-top #progPct { color: var(--ink); font-variant-numeric: tabular-nums; }
  .progress-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; border-radius: 3px; background: linear-gradient(90deg, var(--ice), var(--lime)); }
  .views { position: absolute; left: 16px; top: 16px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 360px); }
  .brand { position: absolute; left: 16px; bottom: 14px; display: grid; gap: 2px; pointer-events: none; text-shadow: 0 2px 12px rgba(0,0,0,.55); }
  .brand-title { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 3.4vw, 40px); line-height: .95; letter-spacing: .02em; text-transform: uppercase; color: var(--ink); }
  .brand-sub { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--lime); }

  .panel { position: absolute; top: 16px; right: 16px; width: 290px; max-height: calc(100% - 32px); overflow-y: auto; box-sizing: border-box;
    background: rgba(23, 30, 38, .86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .panel-head .label { color: var(--ink); }
  .hide-btn { font-size: 12px; padding: 3px 9px; background: transparent; }
  .show-btn { position: absolute; top: 16px; right: 16px; background: rgba(23, 30, 38, .86); box-shadow: 0 6px 20px rgba(0, 0, 0, .35); }
  @media (max-width: 640px) {
    .panel { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; max-height: 48%; }
    .views { left: 12px; top: 12px; max-width: calc(100% - 120px); }
    .show-btn { top: 12px; right: 12px; }
    .brand { display: none; }
  }
  .group { display: grid; gap: 8px; }
  .label { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  button { font: 500 13px var(--body); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--ink-2); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
  .views button { background: rgba(23,30,38,.85); font-size: 12px; padding: 4px 9px; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; padding: 9px 4px; font-size: 13px; line-height: 1.2; color: var(--ink-2); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--lime); }
  .seg button small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); margin-top: 2px; }

  .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 10px 12px; font-size: 14px; text-align: left; }
  .switch .state { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 99px; }
  .switch[aria-pressed="true"] .state { background: rgba(95,212,255,.15); color: var(--ice); }
  .switch[aria-pressed="false"] .state { background: rgba(255,138,61,.14); color: var(--heat); }
  .switch .state.busy { background: rgba(255,204,51,.14); color: var(--hazard); font-variant-numeric: tabular-nums; }

  .temp-row { display: flex; align-items: baseline; justify-content: space-between; }

  input[type=range] { width: 100%; accent-color: var(--hazard); }
  .scale { position: relative; height: 16px; font-family: var(--mono); font-size: 10px; color: var(--ink-2); }
  .scale span { position: absolute; transform: translateX(-50%); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-2); }
  .chip.on { border-color: var(--hazard); color: var(--hazard); background: rgba(255,204,51,.08); }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .checks { display: grid; gap: 6px; }
  .checks label { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .checks input { accent-color: var(--ice); width: 16px; height: 16px; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
(function () {
  const host = document.getElementById('viewport');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.localClippingEnabled = true;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  host.prepend(renderer.domElement);
  const ANISO = renderer.capabilities.getMaxAnisotropy();

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(34, 1, 0.04, 5000);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.minDistance = 0.4;
  controls.maxDistance = 70;
  controls.maxPolarAngle = Math.PI * 0.495;
  controls.autoRotateSpeed = 1.0;

  const hemi = new THREE.HemisphereLight(0xdcecff, 0x151a20, 0.72); scene.add(hemi);
  const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(2.5, 5, 3); scene.add(key);
  key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 15 });
  key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
  const fill = new THREE.DirectionalLight(0xffe6d0, 0.28); fill.position.set(-3, 1.5, 2); scene.add(fill);
  const rim = new THREE.DirectionalLight(0x6fd8ff, 0.45); rim.position.set(-2, 2.5, -3.5); scene.add(rim);

  const V = (x, y, z) => new THREE.Vector3(x, y, z);

  // ---------- Procedural textures ----------
  function canvasTex(w, h, draw, rx, ry) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx || 1, ry || 1); t.anisotropy = ANISO;
    return t;
  }
  const knit = canvasTex(64, 64, (g, s) => {
    for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
      const rib = ((x >> 1) % 2 === 0) !== ((y >> 2) % 2 === 0) ? 175 : 95;
      const v = rib + (Math.random() * 10 - 5);
      g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x, y, 1, 1);
    }
  }, 60, 50);
  const weave = canvasTex(64, 64, (g, s) => {
    for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
      const v = 128 + (Math.random() * 8 - 4) + ((x + y) % 4 < 2 ? 12 : -12);
      g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x, y, 1, 1);
    }
  }, 40, 40);
  const carbon = canvasTex(64, 64, (g, s) => {
    const c = 8;
    for (let y = 0; y < s; y += c) for (let x = 0; x < s; x += c) {
      const alt = ((x / c + y / c) % 2) === 0;
      const grd = alt ? g.createLinearGradient(x, 0, x + c, 0) : g.createLinearGradient(0, y, 0, y + c);
      grd.addColorStop(0, '#16191d'); grd.addColorStop(0.5, '#343a42'); grd.addColorStop(1, '#16191d');
      g.fillStyle = grd; g.fillRect(x, y, c, c);
    }
  }, 6, 6);
  const hexAlpha = canvasTex(128, 128, (g, s) => {
    g.fillStyle = '#fff'; g.fillRect(0, 0, s, s); g.fillStyle = '#000';
    const r = 7, h = r * Math.sqrt(3);
    for (let row = -1; row * h * 0.5 < s + h; row++) for (let col = -1; col * r * 3 < s + r * 3; col++) {
      const cx = col * r * 3 + (row % 2 ? r * 1.5 : 0), cy = row * h * 0.5;
      g.beginPath();
      for (let k = 0; k < 6; k++) { const a = Math.PI / 3 * k; g.lineTo(cx + Math.cos(a) * (r - 1.6), cy + Math.sin(a) * (r - 1.6)); }
      g.fill();
    }
  });

  // ---------- Body shape (torso local frame: +y up the spine, +z out of the chest) ----------
  const TABLE = [
    [-0.29, 0.070, 0.060], [-0.25, 0.130, 0.095], [-0.17, 0.162, 0.110], [-0.08, 0.162, 0.108], [0.0, 0.150, 0.100], [0.10, 0.147, 0.100],
    [0.22, 0.158, 0.106], [0.32, 0.172, 0.112], [0.42, 0.184, 0.116], [0.50, 0.190, 0.110],
    [0.55, 0.182, 0.098], [0.59, 0.140, 0.082], [0.62, 0.090, 0.066], [0.645, 0.058, 0.055],
    [0.70, 0.054, 0.052], [0.76, 0.052, 0.050]
  ];
  const cr = (p0, p1, p2, p3, t) => 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
  function interpTable(tab, x) {
    x = Math.min(tab[tab.length - 1][0], Math.max(tab[0][0], x));
    let i = 0; while (i < tab.length - 2 && x > tab[i + 1][0]) i++;
    const a = tab[Math.max(0, i - 1)], b = tab[i], c = tab[i + 1], d = tab[Math.min(tab.length - 1, i + 2)];
    const t = (x - b[0]) / (c[0] - b[0]);
    const out = [];
    for (let k = 1; k < b.length; k++) out.push(cr(a[k], b[k], c[k], d[k], t));
    return out;
  }
  const gauss = (y, m, s) => Math.exp(-(((y - m) / s) ** 2));
  const EXP = 2 / 2.7;
  function torsoPoint(th, y, off, out) {
    const s = Math.sin(th), c = Math.cos(th);
    const sx = Math.sign(s) * Math.pow(Math.abs(s), EXP), sz = Math.sign(c) * Math.pow(Math.abs(c), EXP);
    const [w, d] = interpTable(TABLE, y);
    let z = (d + off) * sz;
    z += c > 0 ? 0.02 * gauss(y, 0.38, 0.09) * c * c : -0.01 * gauss(y, 0.42, 0.08) * c * c;
    return (out || new THREE.Vector3()).set((w + off) * sx, y, z);
  }
  function ringLength(y, off) {
    let L = 0; const a = new THREE.Vector3(), b = new THREE.Vector3();
    torsoPoint(-Math.PI, y, off, a);
    for (let i = 1; i <= 256; i++) { torsoPoint(-Math.PI + 2 * Math.PI * i / 256, y, off, b); L += a.distanceTo(b); a.copy(b); }
    return L;
  }

  // Grid surface over the torso; u runs by arc length (0.5 = centre of chest) so textures don't stretch
  function torsoSurface(yA, yB, off, opts) {
    opts = opts || {};
    const ny = opts.ny || 120, nth = opts.nth || 128;
    const thA = opts.thA == null ? -Math.PI : opts.thA, thB = opts.thB == null ? Math.PI : opts.thB;
    const uvY = opts.uvY || [yA, yB];
    const pos = [], uv = [], col = [], idx = [], R = nth + 1;
    const ring = Array.from({ length: R }, () => new THREE.Vector3());
    for (let j = 0; j <= ny; j++) {
      const y = yA + (yB - yA) * j / ny;
      let L = 0; const cum = [0];
      for (let i = 0; i <= nth; i++) {
        torsoPoint(thA + (thB - thA) * i / nth, y, off, ring[i]);
        if (i) { L += ring[i].distanceTo(ring[i - 1]); cum.push(L); }
      }
      for (let i = 0; i <= nth; i++) {
        const p = ring[i];
        pos.push(p.x, p.y, p.z); uv.push(cum[i] / L, (y - uvY[0]) / (uvY[1] - uvY[0]));
        if (opts.color) { const c = opts.color(thA + (thB - thA) * i / nth, y); col.push(c.r, c.g, c.b); }
      }
    }
    for (let j = 0; j < ny; j++) for (let i = 0; i < nth; i++) {
      const a = j * R + i, b = a + 1, c = a + R + 1, d = a + R;
      idx.push(a, b, d, b, c, d);
    }
    if (opts.capBottom) {
      const ci = pos.length / 3; pos.push(0, yA, 0); uv.push(0.5, 0);
      if (opts.color) { const c = opts.color(0, yA); col.push(c.r, c.g, c.b); }
      for (let i = 0; i < nth; i++) idx.push(ci, i + 1, i);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    if (opts.color) g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx); g.computeVertexNormals();
    return g;
  }

  // Tube with varying radius along a path. u = 0.5 faces `front`; v = position along the whole path.
  function sweep(pts, radii, opts) {
    opts = opts || {};
    const segs = opts.segs || 60, radial = opts.radial || 48, off = opts.off || 0, t0 = opts.t0 || 0, t1 = opts.t1 == null ? 1 : opts.t1;
    const front = opts.front || V(0, 1, 0);
    const aA = opts.aA == null ? 0 : opts.aA, aB = opts.aB == null ? 2 * Math.PI : opts.aB;
    const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
    const radAt = t => { const f = t * (radii.length - 1), i = Math.min(radii.length - 2, Math.floor(f)); return radii[i] + (radii[i + 1] - radii[i]) * (f - i); };
    const pos = [], uv = [], col = [], idx = [];
    const T = new THREE.Vector3(), N = new THREE.Vector3(), B = new THREE.Vector3(), P = new THREE.Vector3(), dir = new THREE.Vector3();
    let endP = null;
    for (let j = 0; j <= segs; j++) {
      const t = t0 + (t1 - t0) * j / segs;
      curve.getPointAt(t, P); curve.getTangentAt(t, T);
      N.copy(front).addScaledVector(T, -front.dot(T)).normalize().negate();
      B.crossVectors(T, N);
      const r = radAt(t) + off;
      for (let i = 0; i <= radial; i++) {
        const a = aA + (aB - aA) * i / radial;
        dir.copy(N).multiplyScalar(Math.cos(a)).addScaledVector(B, Math.sin(a));
        pos.push(P.x + dir.x * r, P.y + dir.y * r, P.z + dir.z * r); uv.push(i / radial, t);
        if (opts.color) { const c = opts.color(dir, t); col.push(c.r, c.g, c.b); }
      }
      endP = P.clone();
    }
    const R = radial + 1;
    for (let j = 0; j < segs; j++) for (let i = 0; i < radial; i++) {
      const a = j * R + i, b = a + 1, c = a + R + 1, d = a + R;
      idx.push(a, d, b, b, d, c);
    }
    if (opts.capEnd) {
      const ci = pos.length / 3; pos.push(endP.x, endP.y, endP.z); uv.push(0.5, t1);
      if (opts.color) { const c = opts.color(new THREE.Vector3(), 1); col.push(c.r, c.g, c.b); }
      const base = segs * R;
      for (let i = 0; i < radial; i++) idx.push(ci, base + i, base + i + 1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    if (opts.color) g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx); g.computeVertexNormals();
    return g;
  }

  // Lofted body with rounded-box cross-sections along z (car bodywork)

  // Racing line into the right-hander: out to the left, in to the apex, back out
  function racingLine(q, lane) {
    const toOut = smoothstep(S_T1 - 260, S_T1 - 90, q), toApex = smoothstep(S_T1 - 10, S_T1 + 55, q), toExit = smoothstep(S_T1 + 60, S_T1X + 40, q);
    const outside = 5.2, apex = -5.4;
    let l = lane + (outside - lane) * toOut;
    l = l + (apex - l) * toApex;
    return l + (outside - l) * toExit;
  }
  const vLimit = q => q < S_T1 ? Math.sqrt(V_T1 * V_T1 + 2 * BRAKE * Math.max(0, S_T1 - q)) : q <= S_T1X ? V_T1 : 95;
  function startRace() {
    const rnd = (a, b) => a + Math.random() * (b - a);
    const cars = [{ obj: rig, s: zToS(rig.position.z), l: rig.position.x - CX, v: 0, ours: true, react: rnd(0.12, 0.22), launch: rnd(13.5, 15), vTop: rnd(90, 93), passSide: Math.random() < 0.5 ? 1 : -1, latRate: rnd(3.2, 4.2) }]
      .concat(gridCars.map(c => ({ obj: c.g, s: zToS(c.g.position.z), l: c.g.position.x - CX, v: 0, react: rnd(0.15, 0.4), launch: rnd(10.5, 12.8), vTop: rnd(84, 89), passSide: Math.random() < 0.5 ? 1 : -1, latRate: rnd(2.2, 3.2) })));
    cars.forEach(c => { c.lane = c.l; c.yaw = 0; });
    seq.race = { t: 0, cars, s0: cars[0].s, ours: cars[0] };
  }
  function stepRace(dt) {
    const r = seq.race; r.t += dt;
    const cars = r.cars.slice().sort((a, b) => b.s - a.s);
    cars.forEach(c => {
      if (r.t < c.react) { placeCar(c.obj, c.s, c.l); return; }
      // nearest car ahead that overlaps sideways
      let ahead = null, gap = 1e9;
      cars.forEach(o => { if (o === c) return; const d = o.s - c.s; if (d > 0 && d < gap && Math.abs(o.l - c.l) < 2.2) { gap = d; ahead = o; } });
      const accel = c.launch * (1 - c.v / (c.vTop + 8));
      let vWant = Math.min(c.vTop, vLimit(c.s));
      if (ahead) vWant = Math.min(vWant, ahead.v + Math.max(-20, (gap - 6.5) * 1.4));
      c.v = c.v < vWant ? Math.min(vWant, c.v + accel * dt) : Math.max(Math.max(0, vWant), c.v - BRAKE * dt);
      c.s += c.v * dt;
      // lateral: follow the racing line, pull out to pass when stuck behind a slower car
      let lWant = racingLine(c.s, c.lane);
      if (ahead && gap < 28 && (c.ours || c.v > ahead.v + 3)) {
        const sideOK = side => !cars.some(o => o !== c && o !== ahead && Math.abs(o.s - c.s) < 9 && Math.abs(o.l - (ahead.l + side * 3.3)) < 2.2);
        let side = c.passSide; if (!sideOK(side) && sideOK(-side)) side = -side;
        lWant = ahead.l + side * 3.3;
      }
      cars.forEach(o => { if (o !== c && Math.abs(o.s - c.s) < 6 && Math.abs(o.l - c.l) < 2.3) lWant += (c.l >= o.l ? 1 : -1) * 1.5; });
      lWant = Math.max(-6.2, Math.min(6.2, lWant));
      const dl = Math.max(-c.latRate * dt, Math.min(c.latRate * dt, lWant - c.l));
      c.l += dl;
      c.yaw += (Math.atan2(dl, Math.max(0.05, c.v * dt)) - c.yaw) * 0.2;
      placeCar(c.obj, c.s, c.l, c.yaw);
    });
  }
  // Chase camera: behind and high off the line, low alongside for the overtake, then outside Turn 1
  function raceCam() {
    const r = seq.race, o = r.ours; trackFrame(o.s + 4, fr);
    const P = rig.position, fx = fr.tx, fz = fr.tz, lx = fr.lx, lz = fr.lz;
    const k1 = smoothstep(1.5, 5.5, r.t), k2 = smoothstep(S_T1 - 200, S_T1 - 40, o.s);
    const back = -15 + 7 * k1 + 20 * k2, side = -6 + 11 * k1 + 6 * k2, up = 6.5 - 3.6 * k1 + 2 * k2;
    // offsets relative to the car, so the camera never falls behind at speed
    return { off: V(fx * back + lx * side, up, fz * back + lz * side), lookOff: V(fx * (7 - 9 * k2), 0.7, fz * (7 - 9 * k2)) };
  }
  // Loading bar
  seq.shown = 0; seq.stage = null;
  function setStage(base, weight, label, fn) { seq.stage = { base, weight, fn }; $('progLabel').textContent = label; }
  const since = ms => { const t0 = performance.now(); return () => (performance.now() - t0) / ms; };
  function coolantFraction() {
    if (sim.priming) return sim.d / CIRCUIT;
    if (sim.shifting) return sim.shiftD / CIRCUIT;
    if (!state.on) return 1 - Math.min(1, sim.v / 0.6);
    return 1;
  }
  async function runSequence() {
    if (seq.active) return;
    seq.active = true; seq.shown = 0;
    const panelWasOpen = !$('panel').hidden;
    lockUI(true); $('progress').hidden = false;
    controls.autoRotate = false; $('lSpin').checked = false;
    camLook.copy(controls.target);
    // 1. Cooling shirt on the track, side view, flow on, everything else off
    const tMin = since(6000);
    // Say what the coolant is doing: pump off or slower flow means the shirt warms up
    const coolLabel = !state.on ? 'Vest heating up' : sim.shifting ? (sim.shiftUp ? 'Vest cooling down' : 'Vest warming up') : 'Vest cooling down';
    setStage(0, 0.34, coolLabel, () => Math.min(tMin(), coolantFraction()));
    setOutfit('shirt', false);
    state.car = false; $('showCar').checked = false;
    state.xray = false; $('xray').checked = false;
    $('lFlow').checked = true; $('showEnv').checked = true; setEnv(true);
    updateUI();
    await camTo(views.side, 3.4);
    await until(() => tMin() >= 1 && coolantSettled());
    await wait(1100);
    // 2. Race suit on with the car, seen through, then solid
    setStage(0.34, 0.2, 'Race suit', since(9800));
    setOutfit('suit', false);
    state.car = true; $('showCar').checked = true;
    state.xray = true; $('xray').checked = true; updateUI();
    await camTo(views.driver, 3.4);
    await wait(1500);
    state.xray = false; $('xray').checked = false; updateUI();
    await wait(1400);
    await camTo(views.car, 3.0);
    await wait(500);
    // 3. Line up on the grid, lights
    setStage(0.54, 0.16, 'Grid', since(10500));
    await fadeTo(true);
    placeGrid(true); setStartLights(0);
    camera.position.set(rig.position.x + 10, 7.5, rig.position.z - 26); camLook.set(2, 0.5, rig.position.z + 12);
    await fadeTo(false);
    await camTo([[rig.position.x + 7.5, 4.6, rig.position.z - 17], [2, 0.8, rig.position.z + 14]], 3.2);
    for (let n = 1; n <= 5; n++) { setStartLights(n); await wait(950); }
    await wait(400 + Math.random() * 900);
    setStartLights(0);
    // 4. Race to Turn 1
    startRace(); seq.camOff = null; seq.follow = raceCam;
    const goal = S_T1X + 70;
    setStage(0.7, 0.26, 'Race start', () => (seq.race ? (seq.race.ours.s - seq.race.s0) / (goal - seq.race.s0) : 1));
    await until(() => !seq.race || seq.race.ours.s >= goal || seq.race.t > 24);
    // 5. Back to the grid and hand control back
    setStage(0.96, 0.04, 'Resetting', since(1500));
    await fadeTo(true);
    seq.follow = null; seq.race = null;
    placeGrid(false); setStartLights(5);
    setView('driver'); camLook.copy(controls.target);
    setStage(1, 0, 'Done', () => 1); seq.shown = 1;
    await fadeTo(false);
    $('progress').hidden = true;
    lockUI(false, panelWasOpen);
    seq.active = false;
  }

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const m = new THREE.Matrix4(), p = new THREE.Vector3();
  function approach(cur, goal, step) { const d = goal - cur; return Math.abs(d) <= step ? goal : cur + Math.sign(d) * step; }
  const coolStateEl = $('coolState');
  let lastOut = 0;
  let last = performance.now();
  function frame(now) {
    const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now;
    topLocal = approach(topLocal, target.top, reduce ? 10 : 0.9 * dt);
    const upW = UP.clone().applyQuaternion(rig.quaternion);
    topPlane.normal.copy(upW).negate(); topPlane.constant = topLocal + rig.position.dot(upW);
    const suitOn = topLocal > WAIST_C + 0.001;
    upperMat.visible = suitOn; armMats.forEach(mm => mm.visible = suitOn); epMat.visible = suitOn;
    roll.visible = !suitOn;
    const fullyOn = topLocal >= TOP_C - 0.12;
    helmet.visible = fullyOn;
    handMat.color.copy(fullyOn ? gloveColor : skinColor);
    const prevOpacity = carOpacity;
    carOpacity = approach(carOpacity, carGoal(), reduce ? 10 : 1.6 * dt);
    car.visible = carOpacity > 0.001;
    if (car.visible && (carOpacity !== prevOpacity || !frame.painted)) { setOpacity(carMats, carOpacity); frame.painted = true; }
    // the shirt is hidden under a solid suit: skip repainting tubes and moving dots
    const shirtSeen = !(fullyOn && !state.xray);
    frame.n = (frame.n || 0) + 1;
    // Pump spin-up / coast-down: first-order lag towards the speed the voltage sets
    const targetV = state.on ? FLOW_SPEED[state.volt] : 0;
    sim.v += (targetV - sim.v) * (1 - Math.exp(-dt / (state.on ? 1.1 : 0.6)));
    if (Math.abs(targetV - sim.v) < 0.003) sim.v = targetV;
    if (state.on) {
      sim.d += sim.v * dt;
      if (sim.priming && sim.d >= CIRCUIT) sim.priming = false;
      if (sim.shifting) { sim.shiftD += sim.v * dt; if (sim.shiftD >= CIRCUIT) sim.shifting = false; }
    }
    stepHeat(dt, sim.v);
    if (shirtSeen && frame.n % 2 === 0) paintTube();
    const label = state.on
      ? (sim.priming ? 'Priming ' + Math.min(99, Math.floor(sim.d / CIRCUIT * 100)) + '%'
        : sim.shifting ? (sim.shiftUp ? 'Speeding up ' : 'Slowing down ') + Math.min(99, Math.floor(sim.shiftD / CIRCUIT * 100)) + '%'
        : 'Running')
      : (sim.v > 0.02 ? 'Stopping' : 'Off');
    if (coolStateEl.textContent !== label) { coolStateEl.textContent = label; coolStateEl.classList.toggle('busy', label !== 'Running' && label !== 'Off'); }
    if (state.on && (sim.priming || sim.shifting)) statusLed.material.color.copy(cold).multiplyScalar(0.35 + 0.65 * (0.5 + 0.5 * Math.sin(now / 110)));
    else statusLed.material.color.set(state.on ? 0x5fd4ff : 0x333b44);
    if (dots.visible && shirtSeen) {
      for (let i = 0; i < N; i++) {
        const t = flows[dotFlow[i]];
        phase[i] = ((phase[i] + sim.v / t.len * dt) % 1 + 1) % 1;
        t.curve.getPointAt(phase[i], p);
        m.makeTranslation(p.x, p.y, p.z);
        dots.setMatrixAt(i, m);
        dots.setColorAt(i, tempColor(tempAt(t, phase[i]), tmp).offsetHSL(0, 0.1, 0.22));
      }
      dots.instanceMatrix.needsUpdate = true;
      dots.instanceColor.needsUpdate = true;
    }
    key.position.set(rig.position.x + 2.5, 5, rig.position.z + 3); key.target.position.copy(rig.position);
    if (seq.race) stepRace(dt);
    if (seq.active && seq.stage) {
      const st = seq.stage, goal = Math.min(1, st.base + st.weight * Math.min(1, Math.max(0, st.fn())));
      seq.shown = Math.max(seq.shown, seq.shown + (goal - seq.shown) * (1 - Math.exp(-dt * 3)));
      $('progFill').style.width = (seq.shown * 100).toFixed(1) + '%'; $('progPct').textContent = Math.floor(seq.shown * 100) + '%';
    }
    if (seq.active) {
      if (seq.tween) {
        const tw = seq.tween; tw.k = Math.min(1, tw.k + dt / tw.dur); const e = ease(tw.k);
        camera.position.lerpVectors(tw.p0, tw.p1, e); camLook.lerpVectors(tw.t0, tw.t1, e);
        if (tw.k >= 1) { seq.tween = null; tw.res(); }
      } else if (seq.follow) {
        const f = seq.follow(), P = rig.position;
        if (!seq.camOff) { seq.camOff = camera.position.clone().sub(P); seq.lookOff = camLook.clone().sub(P); }
        seq.camOff.lerp(f.off, 1 - Math.exp(-dt * 1.6)); seq.lookOff.lerp(f.lookOff, 1 - Math.exp(-dt * 2.5));
        camera.position.copy(P).add(seq.camOff); camLook.copy(P).add(seq.lookOff);
      }
      camera.lookAt(camLook);
    } else controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
